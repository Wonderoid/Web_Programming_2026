<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
        }

        h1 {
            margin: 15px;
            text-align: center;
        }

        /* 제목 디자인*/
        #titleA {
            background-color: rgb(85, 253, 197);
            padding: 20px;
            margin: -20px -20px 15px -20px;
        }


        /* 버튼 디자인 */
        .edit-button { 
            padding: 6px 12px;
            background-color: white;
            border: 1px solid pink;
            border-radius: 4px;
            cursor: pointer;
        }
        .edit-button:hover {
            background-color: white;
        }

        /* 할 일 목록 */
        #ToDo_Page {

        }

        #ToDo input {

        }

        #ToDo_list {
            
        }

    </style>
</head>
<body>
    <div id="titleA">
        <h1>ToDo</h1>
    </div>

    <div id="ToDo_Page">
        <input type="text" id="ToDo_input" placeholder="할 일을 입력하세요">
        <button class="edit-button">할 일 추가</button>

        <ul id="ToDo_list"></ul>
    </div>
    
</body>
</html>
